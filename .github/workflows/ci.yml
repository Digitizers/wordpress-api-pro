name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  versions:
    name: Version declarations agree
    # The README badge sat at 1.4.0 while this skill shipped 1.5.0, 1.6.0 and
    # 1.6.1 (wordpress-api-pro's at 3.8.2 through 3.9.5): nothing compared
    # them. Every place that states the version has to say the same thing,
    # on pull requests too, so the bump that forgets one is caught before merge.
    runs-on: ubuntu-latest
    env:
      SKILL: wordpress-api-pro/SKILL.md
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md, README badge, package.json and "Current version" lines agree
        run: |
          set -euo pipefail
          skill_v=$(grep -m1 '^version:' "$SKILL" | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
          [ -n "$skill_v" ] || { echo "::error::no version: in $SKILL"; exit 1; }
          mismatch=0
          # Color-agnostic, and the WHOLE semver: shields.io writes a dash inside
          # the value as "--" (version-1.2.0--rc.1-blue renders "1.2.0-rc.1",
          # measured), so take every "--" segment after the core and fold it
          # back. A prerelease is a legitimate version here - release-drift.yml
          # accepts one - and the check must not reject a consistent bump to it.
          badge_v=$(grep -oE 'badge/version-[0-9]+\.[0-9]+\.[0-9]+(--[0-9A-Za-z.+]+)*' README.md | head -1 | sed 's|badge/version-||; s|--|-|g' || true)
          [ "$badge_v" = "$skill_v" ] || { echo "::error::README badge says ${badge_v:-<none>}, $SKILL says $skill_v"; mismatch=1; }
          pkg_v=""
          if [ -f package.json ]; then
            pkg_v=$(jq -r .version package.json)
            [ "$pkg_v" = "$skill_v" ] || { echo "::error::package.json says $pkg_v, $SKILL says $skill_v"; mismatch=1; }
          fi
          # Every "Current version: **x.y.z**" line in the README, if any.
          for v in $(grep -oE 'Current version: \*\*[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*\*\*' README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' || true); do
            [ "$v" = "$skill_v" ] || { echo "::error::README 'Current version' says $v, $SKILL says $skill_v"; mismatch=1; }
          done
          [ "$mismatch" = 0 ] || { echo "::error::bump every declaration in the same commit"; exit 1; }
          echo "SKILL.md, README badge${pkg_v:+, package.json} agree on $skill_v"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shell wrapper syntax
        run: bash -n wordpress-api-pro/wp.sh

      - name: Compile Python scripts
        run: python -m compileall wordpress-api-pro/scripts

      - name: Unit tests
        run: |
          python3 tests/test_cpt_seeding.py
          python3 tests/test_site_audit.py

      - name: Seed dry-run smoke (no network)
        run: |
          python3 wordpress-api-pro/scripts/seed_content.py --dataset tests/fixtures/seed.json > /tmp/plan.json
          python3 -c "import json;d=json.load(open('/tmp/plan.json'));assert d['dry_run'] and len(d['plan'])==2;print('smoke ok')"

      - name: Run package smoke tests
        run: npm test

      - name: Validate npm package contents
        run: npm pack --dry-run
